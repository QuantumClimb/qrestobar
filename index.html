    <!-- Anti-Flash Theme Initializer (Pre-Hydration) -->
    <script>
      (function() {
        try {
          // 1. Existing Light / Dark Mode Pre-Hydration (ThemeContext)
          var saved = localStorage.getItem('theme');
          var theme = saved;
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#050506' : '#F4F4F6');
          }

          // 2. Site-Theme Engine Pre-Hydration (SiteThemeContext)
          var storedSiteTheme = localStorage.getItem('qresto_site_theme_id_v1');
          // In this release, only 'original' is runtime-available; all others safely resolve to 'original'
          var siteTheme = (storedSiteTheme === 'original') ? 'original' : 'original';
          document.documentElement.setAttribute('data-site-theme', siteTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-qc-base text-qc-primary font-body antialiased overflow-x-hidden min-h-screen">
